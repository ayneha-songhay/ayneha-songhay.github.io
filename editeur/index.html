*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--night-deep);color:#EAF0F8;font-family:var(--ui-font);font-size:15px;
  display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.script{font-family:var(--script-font),var(--ui-font)}

/* ---------- En-tête ---------- */
.app-header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--night);
  border-bottom:3px solid var(--orange);flex:0 0 auto}
.logo{width:38px;height:38px;border-radius:50%;background:var(--orange);color:var(--night-deep);
  display:grid;place-items:center;font-family:var(--script-font);font-size:24px;line-height:1;flex:0 0 auto}
.app-title{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.app-title b{font-size:17px;letter-spacing:.3px;white-space:nowrap}
.app-title small{color:var(--muted);font-size:11px}
.header-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.hbtn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 10px;
  display:inline-flex;align-items:center;gap:6px;color:#EAF0F8;font-size:13px}
.hbtn:hover,.hbtn:focus-visible{border-color:var(--orange);outline:none}
.hbtn.primary{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.hbtn svg{width:18px;height:18px}

/* ---------- Onglets ---------- */
.tabs{display:flex;gap:4px;padding:6px 8px 0;background:var(--night-deep);overflow-x:auto;flex:0 0 auto;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px 10px 0 0;
  background:var(--night-soft);color:var(--muted);border:0;max-width:200px;white-space:nowrap;font-size:13px}
.tab.active{background:var(--night);color:#fff;box-shadow:inset 0 3px 0 var(--orange)}
.tab .tname{overflow:hidden;text-overflow:ellipsis}
.tab .tclose{opacity:.7;border-radius:6px;padding:0 4px;font-size:15px;line-height:1}
.tab .tclose:hover{opacity:1;background:rgba(255,255,255,.12)}
.tab.add{background:transparent;color:var(--orange);font-size:18px;padding:5px 12px}

/* ---------- Barre d'outils ---------- */
.toolbar-wrap{background:var(--night);border-bottom:1px solid var(--line);flex:0 0 auto}
#toolbar.ql-toolbar.ql-snow{border:0;padding:6px 8px;display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;
  font-family:var(--ui-font)}
#toolbar .ql-formats{margin-right:6px !important;display:inline-flex;align-items:center;gap:1px;
  padding-right:6px;border-right:1px solid var(--line)}
#toolbar .ql-formats:last-child{border-right:0}
#toolbar button{width:34px;height:34px;padding:6px;border-radius:8px;color:#EAF0F8;display:inline-grid;place-items:center}
#toolbar button:hover,#toolbar button.ql-active,#toolbar button.on{background:rgba(255,102,0,.18)}
#toolbar button svg{width:20px;height:20px}
#toolbar .ql-stroke{stroke:#EAF0F8}
#toolbar .ql-fill{fill:#EAF0F8}
#toolbar button:hover .ql-stroke,#toolbar button.ql-active .ql-stroke{stroke:var(--orange)}
#toolbar button:hover .ql-fill,#toolbar button.ql-active .ql-fill{fill:var(--orange)}
#toolbar .ql-picker{color:#EAF0F8;height:34px}
#toolbar .ql-picker-label{border-radius:8px;display:flex;align-items:center}
#toolbar .ql-picker-label .ql-stroke{stroke:#EAF0F8}
#toolbar .ql-picker-options{background:var(--night);border-color:var(--line) !important;border-radius:10px}
#toolbar .ql-picker-item{color:#EAF0F8}
#toolbar .ql-picker-item:hover,#toolbar .ql-picker-item.ql-selected{color:var(--orange)}
#toolbar .ql-size{width:70px}
#toolbar .ql-picker-label.ql-active,#toolbar .ql-picker-label:hover{color:var(--orange) !important}
#toolbar .ql-picker-label.ql-active .ql-stroke,#toolbar .ql-picker-label:hover .ql-stroke{stroke:var(--orange) !important}
.size-ctl{display:inline-flex;align-items:center;gap:0;background:var(--night-soft);border-radius:9px;margin-left:4px}
#toolbar .size-ctl button.sz{width:28px;height:34px;padding:4px}
#toolbar .size-ctl button.sz svg{width:16px;height:16px}
#sz-val{width:40px;height:30px;border:0;border-radius:6px;background:var(--night-deep);color:#fff;text-align:center;font:600 14px var(--ui-font);
  -moz-appearance:textfield;appearance:textfield;padding:0}
#sz-val::-webkit-outer-spin-button,#sz-val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#sz-val:focus{outline:2px solid var(--orange)}
.ql-snow .ql-picker.ql-size .ql-picker-label::before,.ql-snow .ql-picker.ql-size .ql-picker-item::before{content:attr(data-label)}
.ql-snow .ql-picker.ql-size .ql-picker-label::before{content:"Auto" !important}
#toolbar .ic-btn.wide{width:auto;padding:6px 9px;gap:4px;display:inline-flex;font-size:12px;font-weight:600}
#toolbar .verse-num{font-family:var(--script-font);font-size:18px}

/* ---------- Zone de travail ---------- */
.workspace{flex:1 1 auto;overflow:auto;padding:18px 12px 28px;background:
  radial-gradient(circle at 12% 0%,rgba(255,102,0,.10),transparent 40%),var(--night-deep)}
/* Page à la largeur exacte d'une feuille A4 (zone imprimable 180 mm) : ce qu'on voit
   est ce qui sort en PDF. Sur un petit écran, la page entière est réduite à l'écran. */
#page-wrap{margin:0 auto;position:relative}
.page{background:var(--paper);color:var(--ink);width:calc(180mm + 60px);max-width:none;margin:0;border-radius:6px;transform-origin:top left;
  box-shadow:0 10px 30px rgba(0,0,0,.35);min-height:62vh;display:flex;flex-direction:column}
.page-footer{border-top:1px solid #E5E7EB;color:#4B5563;font-size:12px;padding:10px 18px}
.page-footer a{color:var(--link)}
/* Bas de page : nom à gauche, site à droite */
.foot-split{display:flex;justify-content:space-between;align-items:baseline;gap:16px;direction:ltr;font-family:var(--ui-font)}
.foot-left{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.foot-right{text-align:right;white-space:nowrap;color:var(--link);flex:0 0 auto}
.author-field{background:var(--night-soft);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.author-field label{font-weight:600;font-size:14px}
.author-row{display:flex;align-items:center;gap:8px}
.author-row input{flex:1;min-width:0}
.author-row .count{color:var(--muted);font-size:12px;flex:0 0 auto}
.author-field small{color:var(--muted);font-size:12px;line-height:1.4}
#editor.ql-container.ql-snow{border:0;font-family:var(--script-font),var(--ui-font);font-size:18px;flex:1 1 auto}
:root{--rtl-size:40px;--ltr-size:18px}
.ql-editor{padding:28px 30px;min-height:55vh;line-height:1.4;color:var(--ink);font-size:var(--ltr-size)}
/* Interligne proportionnel : chaque ligne prend la taille de ses plus grandes lettres
   (--line-fs est calculé par l'éditeur), et l'espace entre les lignes suit cette taille. */
.ql-editor p,.ql-editor li,.ql-editor h1,.ql-editor h2,.ql-editor h3{font-size:var(--line-fs,var(--ltr-size))}
.ql-editor p,.ql-editor li{margin:0}
/* Le cœur du correctif : ordre droite à gauche imposé à tous les caractères,
   y compris ceux de la zone privée (PUA) que les logiciels de bureau lisent
   de gauche à droite. Les lignes se coupent ainsi dans le bon ordre. */
.ql-editor .ql-direction-rtl,.script-rtl{direction:rtl;unicode-bidi:bidi-override;text-align:right;
  font-size:var(--line-fs,var(--rtl-size));line-height:1.12}
.ql-editor .ql-direction-rtl.ql-align-center{text-align:center}
.ql-editor .ql-direction-rtl.ql-align-justify{text-align:justify}
.ql-editor .ql-direction-rtl.ql-align-left{text-align:left}
.ql-editor.ql-blank::before{color:#9CA3AF;font-style:normal;font-family:var(--ui-font);font-size:16px;right:30px;left:30px;text-align:right}
/* Images : toujours seules sur leur ligne (plusieurs images peuvent se suivre côte à côte) */
.ql-editor img{max-width:100%;height:auto;cursor:pointer;display:inline-block;vertical-align:bottom;margin:6px 4px;float:none}
.ql-editor p:has(img),.ql-editor li:has(img),.ql-editor .ql-direction-rtl:has(img){line-height:0}
/* Image + description */
.ql-figure{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:bottom;margin:6px 6px;max-width:100%;line-height:1.3;direction:ltr;unicode-bidi:isolate}
.ql-figure img{margin:0;display:block}
.img-cap{width:0;min-width:100%;box-sizing:border-box;border:0;border-bottom:1px dashed #CBD5E1;background:transparent;color:#374151;text-align:center;
  font:14px/1.3 var(--script-font),var(--ui-font);padding:5px 2px 4px;margin:4px 0 0;outline:none;border-radius:0}
.img-cap.cap-rtl{direction:rtl;unicode-bidi:bidi-override;font-size:22px}
.img-cap:focus{border-bottom:2px solid var(--orange);background:#FFF7ED}
.img-cap::placeholder{color:#9CA3AF;font-family:var(--ui-font);font-size:12px;direction:ltr}
.img-cap-text{display:block;width:0;min-width:100%;overflow-wrap:anywhere;text-align:center;color:#374151;font:14px/1.3 var(--script-font),var(--ui-font);margin-top:5px;white-space:pre-wrap}
.img-cap-text.cap-rtl{direction:rtl;unicode-bidi:bidi-override;font-size:22px}

/* Cadre de l'image sélectionnée */
.page{position:relative}
.img-box{position:fixed;border:2px solid var(--orange);pointer-events:none;z-index:5;border-radius:2px}
.img-box.dragging{opacity:.4}
.img-bar{position:absolute;left:50%;top:-50px;transform:translateX(-50%);display:flex;gap:2px;background:var(--night);
  border-radius:10px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:auto;white-space:nowrap}
.img-bar .ib{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:#EAF0F8;display:grid;place-items:center;touch-action:none}
.img-bar .ib svg{width:20px;height:20px}
.img-bar .ib.on{background:rgba(255,102,0,.25);color:var(--orange)}
.img-bar .ib.move{color:var(--orange)}
.img-bar .ib.del:hover{color:#F87171}
.img-h{position:absolute;top:calc(50% - 11px);width:22px;height:22px;border-radius:50%;background:var(--orange);border:3px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:auto;touch-action:none;cursor:ew-resize}
.img-h.hl{left:-11px}.img-h.hr{right:-11px}
.img-size{position:absolute;right:4px;top:4px;background:rgba(6,19,42,.8);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px}
.img-ghost{position:fixed;width:90px;height:68px;background-size:cover;background-position:center;border:2px solid var(--orange);
  border-radius:6px;opacity:.85;pointer-events:none;z-index:90;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.img-caret{position:fixed;width:3px;background:var(--orange);pointer-events:none;z-index:89;border-radius:2px}

/* ---------- Dictionnaire ---------- */
.dict{padding:18px;flex:1 1 auto;display:flex;flex-direction:column;gap:12px}
.dict-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dict-head h2{margin:0 auto 0 0;font-size:17px;color:var(--night)}
.dict select,.dict button.dbtn{border:1px solid #CBD5E1;border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);font-size:13px}
.dict button.dbtn.primary{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.dict-table{display:flex;flex-direction:column;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden}
.drow{display:grid;grid-template-columns:36px 1fr 1fr 40px;direction:rtl;border-top:1px solid #E5E7EB;align-items:stretch}
.drow:first-child{border-top:0}
.drow.hdr{background:#F3F4F6;font-weight:600;font-size:12px;color:#374151}
.drow.hdr>div{padding:8px 10px;direction:ltr;text-align:center}
.drow .num{display:grid;place-items:center;font-size:12px;color:#6B7280;direction:ltr}
.cell{padding:6px 10px;min-height:46px;outline:none;color:var(--ink);font-size:17px;line-height:1.35;
  border-left:1px solid #E5E7EB}
.cell.script-cell{font-family:var(--script-font),var(--ui-font);font-size:32px;direction:rtl;unicode-bidi:bidi-override;text-align:right}
.cell.other-ltr{direction:ltr;text-align:left}
.cell.other-rtl{direction:rtl;text-align:right;font-family:"Noto Sans NKo","Ebrima",var(--ui-font)}
.cell:focus{background:#FFF7ED;box-shadow:inset 0 0 0 2px var(--orange)}
.drow .del{border:0;background:transparent;color:#9CA3AF;font-size:18px}
.drow .del:hover{color:#DC2626}
.dict-empty{color:#6B7280;text-align:center;padding:18px;font-size:14px}

/* ---------- Clavier AYNEHA ---------- */
.kbd{background:var(--night);border-top:3px solid var(--orange);padding:6px 6px 8px;flex:0 0 auto;
  display:none;user-select:none;-webkit-user-select:none}
body.kbd-open .kbd{display:block}
.kbd-tabs{display:flex;gap:4px;margin-bottom:6px;align-items:center}
.kbd-tabs button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted)}
.kbd-tabs button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.kbd-tabs .spacer{flex:1}
.variants{display:flex;gap:4px;min-height:44px;direction:rtl;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.variants:empty::after{content:attr(data-hint);color:var(--muted);font-size:12px;direction:ltr;align-self:center;padding:0 6px}
.variants button{flex:0 0 auto;min-width:54px;height:44px;border-radius:10px;border:1px solid var(--orange);
  background:rgba(255,102,0,.12);color:#fff;font-family:var(--script-font);font-size:28px;line-height:1;display:flex;
  flex-direction:column;align-items:center;justify-content:center}
.variants button small{font-family:var(--ui-font);font-size:9px;color:var(--orange-soft);margin-top:1px}
.keys{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;direction:rtl}
.key{height:46px;border-radius:9px;border:0;background:var(--night-soft);color:#fff;
  font-family:var(--script-font);font-size:28px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 2px 0 rgba(0,0,0,.35)}
.key small{font-family:var(--ui-font);font-size:9px;color:var(--muted);margin-top:2px}
.key:active{background:var(--orange)}
.key.fn{font-family:var(--ui-font);font-size:13px;background:#24426F}
.key.space{grid-column:span 4}
.key.vowel{background:#20406E}

/* ---------- Fenêtres ---------- */
.modal{position:fixed;inset:0;background:rgba(3,8,20,.66);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.sheet{background:var(--night);border-top:3px solid var(--orange);border-radius:16px 16px 0 0;width:100%;max-width:640px;
  max-height:86vh;overflow:auto;padding:14px 16px 20px}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:16px;border:1px solid var(--line);border-top:3px solid var(--orange)}}
.sheet h3{margin:4px 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.sheet .close{margin-left:auto;background:transparent;border:0;font-size:22px;color:var(--muted)}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-list button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--night-soft);border:0;border-radius:12px;padding:12px 14px;font-size:15px}
.menu-list button:hover{background:#21406F}
.menu-list button svg{width:22px;height:22px;color:var(--orange);flex:0 0 auto}
.menu-list button span small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.help-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.help-item .hicon{flex:0 0 40px;height:40px;border-radius:10px;background:var(--night-soft);display:grid;place-items:center;color:#fff}
.help-item .hicon svg{width:22px;height:22px}
.help-item .hicon .ql-stroke{stroke:#fff;fill:none}.help-item .hicon .ql-fill{fill:#fff}
.help-item b{display:block;margin-bottom:2px;color:#fff}
.help-item p{margin:0;color:#C7D2E3;font-size:13px;line-height:1.45}
.help-section{color:var(--orange);font-size:12px;letter-spacing:.8px;text-transform:uppercase;margin:16px 0 2px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field input{border:1px solid var(--line);background:var(--night-deep);color:#fff;border-radius:10px;padding:10px 12px;font-size:15px}
.row-btns{display:flex;gap:8px;justify-content:flex-end}
.autosave-list button{justify-content:space-between}
.privacy p{color:#C7D2E3;font-size:13px;line-height:1.55}
.privacy a{color:var(--orange-soft)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#fff;color:var(--night);
  padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:.25s;z-index:80;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Mode lecture ---------- */
.exit-reading{display:none;position:fixed;top:12px;right:12px;z-index:40}
body.reading .app-header,body.reading .tabs,body.reading .toolbar-wrap,body.reading .kbd,body.reading .dict-head,body.reading .drow .del,body.reading .dict-add{display:none !important}
body.reading .exit-reading{display:inline-flex}
body.reading .workspace{padding:0;background:var(--paper)}
body.reading .page{border-radius:0;box-shadow:none}

/* ---------- Zones d'export ---------- */
#print-root{display:none}
#image-root{position:fixed;left:-20000px;top:0;width:calc(180mm + 96px);background:#fff;color:var(--ink)}
.export-page{background:#fff;color:var(--ink);font-family:var(--script-font),var(--ui-font)}
.export-page .ql-editor{min-height:0;padding:0;overflow:visible;height:auto}
.export-title{font-family:var(--ui-font);font-size:12px;color:#6B7280;margin-bottom:10px}
.export-footer{font-family:var(--ui-font);font-size:10px;color:#4B5563;border-top:1px solid #E5E7EB;padding-top:8px;margin-top:24px}
.export-footer .lk{color:var(--link)}
#image-root .export-page{padding:44px 48px}
#image-root .export-footer{font-size:11px}

@media print{
  @page{size:A4;margin:14mm 15mm 8mm 15mm}
  html,body{height:auto;overflow:visible;background:#fff !important;display:block}
  body>*:not(#print-root){display:none !important}
  #print-root{display:block !important}
  .print-table{width:100%;border-collapse:collapse;border:0}
  .print-table td{padding:0;border:0;vertical-align:top}
  .print-table tfoot{display:table-footer-group}
  /* espace réservé en bas de chaque page, sous le texte */
  .print-foot-space{height:16mm}
  /* le bas de page se pose dans cet espace, sur chaque page */
  #print-root .print-footer{position:fixed;left:0;right:0;bottom:0;height:10mm;font-size:9pt;color:#4B5563;
    border-top:1px solid #D1D5DB;padding-top:2.5mm;background:#fff}
  #print-root .print-footer .lk{color:var(--link)}
  #print-root .drow .del{display:none}
  .img-box{display:none !important}
  #print-root .dict-table{border-radius:0}
  #print-root .drow{break-inside:avoid}
  .ql-editor .ql-direction-rtl{break-inside:auto}
  .ql-editor p,.ql-editor li{orphans:2;widows:2}
}

@media (max-width:560px){
  .app-title small{display:none}
  .hbtn .lbl{display:none}
  .key{height:42px;font-size:24px}
  .workspace{padding:10px 6px 20px}
}
</style>

<body>

<header class="app-header">
  <div class="logo" aria-hidden="true" id="logo"></div>
  <div class="app-title"><b id="app-name">AYNEHA Web Editor</b><small data-i18n="tagline"></small></div>
  <div class="header-actions">
    <button class="hbtn" id="btn-lang" title="FR / EN">FR</button>
    <button class="hbtn" id="btn-help" data-i18n-title="help"><svg data-icon="help"></svg><span class="lbl">Infos+</span></button>
    <button class="hbtn primary" id="btn-menu" data-i18n-title="menu"><svg data-icon="menu"></svg><span class="lbl" data-i18n="file"></span></button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<div class="toolbar-wrap" id="toolbar-wrap">
  <div id="toolbar">
    <span class="ql-formats">
      <button type="button" class="ic-btn" id="tb-undo" data-i18n-title="undo"><svg data-icon="undo"></svg></button>
      <button type="button" class="ic-btn" id="tb-redo" data-i18n-title="redo"><svg data-icon="redo"></svg></button>
    </span>
    <span class="ql-formats">
      <button type="button" class="ic-btn wide" id="tb-dir" data-i18n-title="direction"><span class="script" style="font-size:18px" id="dir-glyph"></span><span>/ Abc</span></button>
      <button type="button" class="ic-btn" id="tb-flip" data-i18n-title="flip"><svg data-icon="flip"></svg></button>
      <span class="size-ctl">
        <button type="button" class="ic-btn sz" id="sz-down" data-i18n-title="sizeDown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <input id="sz-val" type="number" min="12" max="72" step="1" inputmode="numeric" data-i18n-title="size">

<script>/* ============================================================
   CONFIGURATION DE L'ÉCRITURE ET DU THÈME

   version Dogon NÈNÈ (ou une autre écriture), on remplace
   seulement ce fichier : nom, couleurs, police, lettres,
   ordre alphabétique et clavier. Le reste de l'éditeur ne
   change pas.
   ============================================================ */
window.EDITOR_CONFIG = {
  // appName : identifiant interne des fichiers .ayneha (ne pas changer, pour que
  // les documents s'ouvrent dans les deux versions). displayName : nom affiché,
  // remplacé par build.py selon la version (web ou Android).

  displayName: "AYNEHA Web Editor",
  scriptName: "AYNEHA",
  version: "1.0.9",
  site: "https://ayneha.org",
  sourceCode: "https://github.com/maigus223/ayneha-web-editor",
  devContact: "gwokmt2q@duck.com",
  author: "Mahamadou Issiaka Maïga (Maïgus)",

    fr: "Mahamadou Issiaka Maïga (Maïgus) - concepteur et créateur de l'écriture AYNEHA et de cet outil - https://ayneha.org",

  // L'écriture s'écrit de droite à gauche sur tous ses caractères
  rtl: true,

  // Glyphe utilisé comme logo (H)
  logoChar: "",

  /* Lettres de base. code = point de code, lat = repère latin,

  vowels: [
    { code: 0xE020, lat: "a", variants: [[0xE025, "aa"], [0xE026, "ã"]] },
    { code: 0xE021, lat: "e", variants: [[0xE027, "ee"], [0xE028, "ẽ"], [0xE029, "ɛ"]] },
    { code: 0xE022, lat: "i", variants: [[0xE02A, "ii"], [0xE02B, "ĩ"]] },

    { code: 0xE00F, lat: "d", variants: [[0xE03B, "dd"], [0xE03C, "d muet"]] },
    { code: 0xE010, lat: "t", variants: [[0xE03D, "tt"], [0xE03E, "t muet"]] },
    { code: 0xE011, lat: "n", variants: [[0xE03F, "nn"], [0xE040, "n muet"]] },
    { code: 0xE012, lat: "l", variants: [[0xE041, "ll"], [0xE042, "l muet"]] },
    { code: 0xE013, lat: "r", variants: [[0xE043, "rr"], [0xE044, "r muet"]] },
    { code: 0xE014, lat: "s", variants: [[0xE045, "ss"], [0xE046, "s muet"]] },
    { code: 0xE015, lat: "z", variants: [[0xE047, "zz"], [0xE048, "z muet"]] },
    { code: 0xE016, lat: "sh", variants: [[0xE049, "shsh"]] },
    { code: 0xE017, lat: "c", variants: [[0xE04A, "cc"]] },
    { code: 0xE018, lat: "j", variants: [[0xE04B, "jj"]] },
    { code: 0xE019, lat: "dj", variants: [[0xE04C, "djdj"], [0xE04D, "dj muet"]] },
    { code: 0xE01A, lat: "ɲ", variants: [[0xE04E, "ɲɲ"]] },
    { code: 0xE01B, lat: "y", variants: [[0xE04F, "yy"], [0xE050, "y muet"]] },
    { code: 0xE01C, lat: "g", variants: [[0xE051, "gg"], [0xE052, "g muet"]] },
    { code: 0xE01D, lat: "k", variants: [[0xE053, "kk"], [0xE054, "k muet"]] },
    { code: 0xE01E, lat: "h", variants: [] },
    { code: 0xE01F, lat: "ŋ", variants: [[0xE055, "ŋŋ"], [0xE056, "ŋ muet"]] }

  altRangeStart: 0x10FF7C,

  dictionaries: [

  ]
};

  function setKeyboard(open) {
    document.body.classList.toggle('kbd-open', open);
    $('#tb-kbd').classList.toggle('on', open);
    if (open) quill.root.setAttribute('inputmode', 'none'); else quill.root.removeAttribute('inputmode');
    $$('#dict-view .script-cell, #editor input.img-cap').forEach(function (c) { if (open) c.setAttribute('inputmode', 'none'); else c.removeAttribute('inputmode'); });
    if (open) renderKeys();
  }
  $('#k-close').addEventListener('pointerdown', function (e) { e.preventDefault(); setKeyboard(false); });
  $$('.kbd-tabs [data-kpage]').forEach(function (b) {
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault(); kpage = b.getAttribute('data-kpage');
      $$('.kbd-tabs [data-kpage]').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderKeys();
    });
  });
  function key(label, cls, action) {
    var b = document.createElement('button'); b.type = 'button'; b.tabIndex = -1;
    b.className = 'key' + (cls ? ' ' + cls : '');
    if (label.svg) b.innerHTML = svg(label.svg); else b.textContent = label;
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); action(); });
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
    return b;
  }
  function renderKeys() {
    var box = $('#keys'); box.innerHTML = '';
    if (kpage === 'letters') {
      C.vowels.forEach(function (v) { box.appendChild(key(String.fromCodePoint(v.code), 'vowel', function () { typeLetter(v); })); });
      C.consonants.forEach(function (c) { box.appendChild(key(String.fromCodePoint(c.code), '', function () { typeLetter(c); })); });
      var used = C.vowels.length + C.consonants.length, rest = (10 - used % 10) % 10;
      var extra = ['!', ':', '-', '«', '»', '(', ')'];
      for (var i = 0; i < rest; i++) (function (ch) { box.appendChild(key(ch, 'fn', function () { typeText(ch); })); })(extra[i] || ' ');
    } else {
      C.digits.slice(1).concat([C.digits[0]]).forEach(function (d) {
        box.appendChild(key(String.fromCodePoint(d), '', function () { typeText(String.fromCodePoint(d)); }));
      });
      ['+', '-', '×', '÷', '=', '%', '/', '(', ')', '"'].forEach(function (ch) { box.appendChild(key(ch, 'fn', function () { typeText(ch); })); });
    }
    // Dernière rangée commune
    box.appendChild(key(String.fromCodePoint(C.punctuation[0][0]), '', function () { typeText(String.fromCodePoint(C.punctuation[0][0])); }));
    box.appendChild(key(String.fromCodePoint(C.punctuation[1][0]), '', function () { typeText(String.fromCodePoint(C.punctuation[1][0])); }));
    box.appendChild(key('.', 'fn', function () { typeText('.'); }));
    box.appendChild(key('', 'fn space', function () { typeText(' '); }));
    box.appendChild(key('?', 'fn', function () { typeText('?'); }));
    box.appendChild(key({ svg: 'enter' }, 'fn', function () { typeText('\n'); }));
    box.appendChild(key({ svg: 'backspace' }, 'fn', backspace));
  }
  function typeLetter(letter) {
    var ch = String.fromCodePoint(letter.code);
    if (typeText(ch)) { lastInsert = letter; showVariants(letter); }
  }
  function typeText(s) {
    if (lastTarget === 'editor') {
      var d = activeDoc(); if (!d || d.type !== 'text') { toast(t('kbdTarget')); return false; }
      var r = quill.getSelection() || lastRange;
      if (r.length) quill.deleteText(r.index, r.length, 'user');
      quill.insertText(r.index, s, 'user');
      lastRange = { index: r.index + s.length, length: 0 };
      quill.setSelection(lastRange.index, 0, 'silent');
      if (s === '\n') { clearVariants(); }
      return true;
    }
    if (lastTarget && lastTarget.isConnected) {
      if (s === '\n') { lastTarget.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); return false; }
      lastTarget.focus();
      if (!document.execCommand('insertText', false, s)) { lastTarget.textContent += s; lastTarget.dispatchEvent(new Event('input')); }
      return true;
    }
    toast(t('kbdTarget')); return false;
  }
  function backspace() {
    clearVariants();
    if (lastTarget === 'editor') {
      var r = quill.getSelection() || lastRange;
      if (r.length) { quill.deleteText(r.index, r.length, 'user'); lastRange = { index: r.index, length: 0 }; }
      else if (r.index > 0) {
        // supprime un caractère complet (les points de code du plan 16 font 2 unités)
        var prev = quill.getText(Math.max(0, r.index - 2), 2), n = 1;
        if (prev.length === 2 && /[\uDC00-\uDFFF]/.test(prev[1]) && /[\uD800-\uDBFF]/.test(prev[0])) n = 2;
        quill.deleteText(r.index - n, n, 'user'); lastRange = { index: r.index - n, length: 0 };
      }
      quill.setSelection(lastRange.index, 0, 'silent');
      return;
    }
    if (lastTarget && lastTarget.isConnected) { lastTarget.focus(); document.execCommand('delete'); }
  }
  function showVariants(letter) {
    var box = $('#variants'); box.innerHTML = '';
    if (!letter.variants.length) return;
    letter.variants.forEach(function (v) {
      var b = document.createElement('button'); b.type = 'button'; b.tabIndex = -1;
      b.textContent = String.fromCodePoint(v[0]);
      b.addEventListener('mousedown', function (e) { e.preventDefault(); });
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        replacePrevious(String.fromCodePoint(letter.code), String.fromCodePoint(v[0]));
        clearVariants();
      });
      box.appendChild(b);
    });
  }
  function clearVariants() { $('#variants').innerHTML = ''; lastInsert = null; }
  function replacePrevious(base, repl) {
    if (lastTarget === 'editor') {
      var r = quill.getSelection() || lastRange;
      if (r.index > 0 && quill.getText(r.index - base.length, base.length) === base) {
        var fmt = quill.getFormat(r.index - base.length, base.length);
        quill.deleteText(r.index - base.length, base.length, 'user');
        quill.insertText(r.index - base.length, repl, fmt, 'user');
        lastRange = { index: r.index - base.length + repl.length, length: 0 };
        quill.setSelection(lastRange.index, 0, 'silent');
      } else typeText(repl);
      return;
    }
    if (lastTarget && lastTarget.isConnected) {
      lastTarget.focus(); document.execCommand('delete'); document.execCommand('insertText', false, repl);
    }
  }

  /* ---------------- Fenêtres ---------------- */
  function openSheet(title, body) {
    var sh = $('#sheet'); sh.innerHTML = '';
    var h = document.createElement('h3'); h.textContent = title;
    var x = document.createElement('button'); x.className = 'close'; x.innerHTML = '×'; x.onclick = closeSheet; h.appendChild(x);
    sh.appendChild(h); sh.appendChild(body);
    $('#modal').classList.add('show');
  }
  function closeSheet() { $('#modal').classList.remove('show'); }
  $('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeSheet(); });
  function menuList(items) {
    var box = document.createElement('div'); box.className = 'menu-list';
    items.forEach(function (it) {
      var b = document.createElement('button');
      b.innerHTML = svg(it.icon) + '<span><b></b><small></small></span>';
      b.querySelector('b').textContent = it.label; b.querySelector('small').textContent = it.sub || '';
      b.onclick = function () { closeSheet(); it.run(); };
      box.appendChild(b);
    });
    return box;
  }
  function authorField() {
    var box = document.createElement('div'); box.className = 'field author-field';
    box.innerHTML = '<label></label><div class="author-row"><input type="text" maxlength="50" autocomplete="name"><span class="count"></span></div><small></small>';
    box.querySelector('label').textContent = t('authorLabel');
    box.querySelector('small').textContent = t('authorHelp');
    var inp = box.querySelector('input'), cnt = box.querySelector('.count');
    inp.value = author; inp.placeholder = t('authorPlaceholder');
    var upd = function () { cnt.textContent = inp.value.length + '/50'; };
    upd();
    inp.addEventListener('input', function () { setAuthor(inp.value); upd(); });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
    return box;
  }
  function openFileMenu() {
    syncCurrent();
    var body = document.createElement('div');
    body.appendChild(authorField());
    body.appendChild(menuList([
      { icon: 'doc', label: t('newText'), sub: t('newTextSub'), run: function () { addDoc(makeText(), true); } },
      { icon: 'dict', label: t('newDict'), sub: t('newDictSub'), run: openDictChoice },
      { icon: 'open', label: t('open'), sub: t('openSub'), run: function () { $('#file-open').click(); } },
      { icon: 'save', label: t('save'), sub: t('saveSub'), run: saveFile },
      { icon: 'pdf', label: t('exportPdf'), sub: t('exportPdfSub'), run: exportPdf },
      { icon: 'image', label: t('exportImage'), sub: t('exportImageSub'), run: exportImage },
      { icon: 'txt', label: t('exportTxt'), sub: t('exportTxtSub'), run: exportTxt },
      { icon: 'clock', label: t('autosaves'), sub: t('autosavesSub'), run: openAutosaves },
      { icon: 'edit', label: t('rename'), sub: activeDoc() ? activeDoc().title : '', run: openRename },
      { icon: 'shield', label: t('privacy'), sub: t('privacySub'), run: openPrivacy }
    ]));
    openSheet(t('file'), body);
  }
  function openNewMenu() {
    openSheet(t('newText'), menuList([
      { icon: 'doc', label: t('newText'), sub: t('newTextSub'), run: function () { addDoc(makeText(), true); } },
      { icon: 'dict', label: t('newDict'), sub: t('newDictSub'), run: openDictChoice }
    ]));
  }
  function openDictChoice() {
    openSheet(t('chooseDict'), menuList(C.dictionaries.map(function (x) {
      return { icon: 'dict', label: x.label[lang], run: function () { addDoc(makeDict(x.id)); } };
    })));
  }
  function openRename() {
    var d = activeDoc(); if (!d) return;
    var box = document.createElement('div');
    box.innerHTML = '<div class="field"><label></label><input type="text" maxlength="80"></div><div class="row-btns"><button class="hbtn c"></button><button class="hbtn primary o"></button></div>';
    box.querySelector('label').textContent = t('title');
    var inp = box.querySelector('input'); inp.value = d.title;
    box.querySelector('.c').textContent = t('cancel'); box.querySelector('.c').onclick = closeSheet;
    box.querySelector('.o').textContent = t('ok');
    var go = function () { var v = inp.value.trim(); if (v) { d.title = v; markDirty(); renderTabs(); if (d.type === 'dict') renderDict(); } closeSheet(); };
    box.querySelector('.o').onclick = go;
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    openSheet(t('rename'), box);
    setTimeout(function () { inp.focus(); inp.select(); }, 60);
  }

      '<p style="color:#9FB0C8">' + (C.displayName || C.appName) + ' ' + C.version + ' - ' + t('by') + '</p>';

  function wireExternalLinks(root) {
    $$('a', root).forEach(function (a) {
      a.target = '_blank'; a.rel = 'noopener';
      if (isAndroid) a.addEventListener('click', function (e) { e.preventDefault(); try { AndroidBridge.openExternal(a.href); } catch (x) {} });
    });
  }
  function openAutosaves() {
    DB.allSnaps().then(function (list) {
      list = (list || []).sort(function (a, b) { return b.time - a.time; });
      var box = document.createElement('div');
      if (!list.length) { box.innerHTML = '<p style="color:#9FB0C8"></p>'; box.firstChild.textContent = DB.ok ? t('autosaveEmpty') : t('storageOff'); }
      else {
        box.className = 'menu-list autosave-list';
        list.forEach(function (s) {
          var b = document.createElement('button');
          b.innerHTML = svg(s.doc.type === 'dict' ? 'dict' : 'doc') + '<span style="flex:1"><b></b><small></small></span>';
          b.querySelector('b').textContent = s.doc.title;
          b.querySelector('small').textContent = s.name;
          b.onclick = function () {
            closeSheet();
            var d = JSON.parse(JSON.stringify(s.doc)); d.id = uid();
            if (state.docs.some(function (x) { return x.title === d.title; })) d.title = d.title + ' (' + s.name.split('_').slice(-1)[0] + ')';
            addDoc(d);
          };
          box.appendChild(b);
        });
      }
      openSheet(t('autosaves'), box);
    });
  }

      [null, '<span class="script" style="font-size:20px">' + String.fromCodePoint(C.vowels[0].code) + '</span>', t('direction'), fr ? "Bascule la ligne où se trouve le curseur entre l'écriture " + C.scriptName + " (de droite à gauche, toutes les lettres dans le bon ordre, même quand la ligne se coupe) et le texte latin (de gauche à droite). Une ligne collée depuis le transcripteur passe toute seule en " + C.scriptName + "." : "Switches the line holding the cursor between " + C.scriptName + " script (right to left, every letter in the right order, even when the line wraps) and Latin text (left to right). A line pasted from the transcriber switches to " + C.scriptName + " by itself."],
      ['flip', null, fr ? "Retourner l'ordre" : "Reverse the order", fr ? "Le transcripteur propose deux copies. « Copier en ordre normal » se colle directement. « Copier pour WhatsApp / Word » donne un texte déjà retourné : l'éditeur le reconnaît grâce à la ponctuation et le remet tout seul dans le bon ordre. Si un texte sans ponctuation reste à l'envers, sélectionnez ses lignes et touchez ce bouton." : "The transcriber offers two copies. \"Copy in normal order\" pastes directly. \"Copy for WhatsApp / Word\" gives already reversed text: the editor recognises it through punctuation and puts it back in order by itself. If text without punctuation stays backwards, select its lines and tap this button."],
      ['undo', null, t('undo') + ' / ' + t('redo'), fr ? "Revient en arrière ou refait la dernière modification." : "Goes back or redoes the last change."],
      [fr ? 'Mettre en forme' : 'Formatting'],
      [null, '<b style="font-size:13px">Aa</b>', t('size'), fr ? "Change la taille du texte sélectionné, de 12 à 72. Les petites flèches bas et haut retirent ou ajoutent 1 à chaque appui (maintenir le doigt pour aller plus vite), le chiffre peut aussi être tapé directement, et le bouton « Auto » propose des tailles toutes prêtes (12, 16, 20... 72). C'est le bon outil pour mettre un titre en valeur en " + C.scriptName + "." : "Changes the size of the selected text, from 12 to 72. The small down and up arrows remove or add 1 at each tap (hold for faster), the number can also be typed directly, and the \"Auto\" button offers ready-made sizes (12, 16, 20... 72). It is the right tool to highlight a title in " + C.scriptName + "."],
      [null, qi.color, t('color'), fr ? "Change la couleur des lettres sélectionnées." : "Changes the colour of the selected letters."],
      [null, qi.background, t('highlight'), fr ? "Met un fond de couleur derrière le texte, comme un surligneur." : "Puts a coloured background behind the text, like a highlighter."],
      [null, qi.align[''], t('align'), fr ? "Aligne la ligne à droite, au centre, à gauche ou justifiée." : "Aligns the line right, centre, left or justified."],
      [null, qi.list.ordered, t('listNum') + ' / ' + t('listBullet'), fr ? "Crée une liste numérotée ou à puces." : "Creates a numbered or bulleted list."],
      [null, qi.image, t('image'), fr ? "Ajoute une photo ou une illustration depuis l'appareil. Touchez l'image pour la régler : les ronds orange de chaque côté l'agrandissent ou la réduisent, les trois boutons la placent à gauche, au centre ou à droite (une image reste toujours seule sur sa ligne, sans texte à côté ; plusieurs images peuvent se suivre côte à côte), la croix fléchée se maintient et se glisse pour déplacer l'image ailleurs dans le texte, la corbeille la supprime. Sous chaque image, un petit champ permet d'écrire sa description, en latin ou en " + C.scriptName + " (avec le clavier " + C.scriptName + ")." : "Adds a photo or illustration from the device. Tap the image to adjust it: the orange dots on each side enlarge or reduce it, the three buttons place it left, centre or right (an image always stays on its own line, without text beside it; several images can sit side by side), the arrow cross is held and dragged to move the image elsewhere in the text, the bin deletes it. Under each image, a small field lets you write its description, in Latin or " + C.scriptName + " (with the " + C.scriptName + " keyboard)."],

      ['pdf', null, t('exportPdf'), fr ? "Crée un PDF avec la police " + C.scriptName + " incluse : il s'affiche correctement sur n'importe quel téléphone ou ordinateur. Dans la fenêtre qui s'ouvre, choisissez « Enregistrer en PDF »." : "Creates a PDF with the " + C.scriptName + " font included: it displays correctly on any phone or computer. In the window that opens, choose \"Save as PDF\"."],

      ['dict', null, t('dictionary'), fr ? "Trois dictionnaires à deux colonnes : " + C.scriptName + "-Français, " + C.scriptName + "-Anglais et " + C.scriptName + "-N'ko. Le tri se fait par l'ordre alphabétique " + C.scriptName + " (voyelles puis consonnes) ou par l'ordre latin, croissant ou décroissant. Chaque mot reste toujours sur la même ligne que son sens." : "Three two-column dictionaries: " + C.scriptName + "-French, " + C.scriptName + "-English and " + C.scriptName + "-N'ko. Sorting uses the " + C.scriptName + " alphabetical order (vowels then consonants) or the Latin order, ascending or descending. Each word always stays on the same row as its meaning."],

  /* ---------------- Exports ---------------- */
  function stamp(d) {
    d = d || new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    var days = lang === 'fr' ? ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'] : ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '_' + days[d.getDay()] + '_' + p(d.getHours()) + '-' + p(d.getMinutes()) + '-' + p(d.getSeconds());
  }
  function safeName(s) { return (s || 'document').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '_').slice(0, 60); }
  function buildExport(forPrint) {
    var d = activeDoc(); syncCurrent();
    var content = document.createElement('div');
    if (d.type === 'text') {
      var ed = document.createElement('div'); ed.className = 'ql-editor'; ed.innerHTML = quill.root.innerHTML;
      ed.removeAttribute('contenteditable'); ed.classList.remove('ql-blank');
      var live = $$('input.img-cap', quill.root);
      $$('input.img-cap', ed).forEach(function (inp, k) {
        var v = live[k] ? live[k].value : (inp.getAttribute('value') || '');
        if (!v.trim()) { inp.remove(); return; }
        var sp = document.createElement('span'); sp.className = 'img-cap-text' + (capHasScript(v) ? ' cap-rtl' : ''); sp.textContent = v;
        inp.replaceWith(sp);
      });
      var wrap = document.createElement('div'); wrap.className = 'ql-snow'; wrap.appendChild(ed);
      content.appendChild(wrap);
    } else {
      content.appendChild(renderDict(true));
    }
    var page = document.createElement('div'); page.className = 'export-page';
    if (forPrint) {
      // Tableau dont le pied se répète sur chaque page : il réserve la place du
      // bas de page, le texte s'arrête donc toujours au-dessus de la ligne.
      var table = document.createElement('table'); table.className = 'print-table';
      table.innerHTML = '<tbody><tr><td class="print-body"></td></tr></tbody><tfoot><tr><td><div class="print-foot-space"></div></td></tr></tfoot>';
      table.querySelector('.print-body').appendChild(content);
      page.appendChild(table);
      var pf = document.createElement('div'); pf.className = 'print-footer'; pf.appendChild(footerNode());
      page.appendChild(pf);
    } else {
      page.appendChild(content);
      var f = document.createElement('div'); f.className = 'export-footer'; f.appendChild(footerNode());
      page.appendChild(f);
    }
    return page;
  }
  function exportPdf() {
    var root = $('#print-root'); root.innerHTML = ''; root.appendChild(buildExport(true));
    var name = safeName(activeDoc().title) + '_' + stamp();
    var oldTitle = document.title; document.title = name;
    document.fonts.ready.then(function () {
      if (isAndroid) { try { AndroidBridge.printPdf(name); } catch (e) {} setTimeout(function () { document.title = oldTitle; }, 1500); return; }
      toast(t('printing'));
      setTimeout(function () { window.print(); document.title = oldTitle; }, 300);
    });
  }
  function fontEmbedCss() {
    return document.getElementById('font-face').textContent;
  }
  function exportImage() {
    toast(t('imageWorking'));
    var root = $('#image-root'); root.innerHTML = ''; root.appendChild(buildExport(false));
    document.fonts.ready.then(function () {
      return htmlToImage.toPng(root, { pixelRatio: 2, backgroundColor: '#ffffff', fontEmbedCSS: fontEmbedCss(), cacheBust: false,
        width: root.offsetWidth, height: root.offsetHeight, style: { position: 'static', left: '0', top: '0', margin: '0' } });
    }).then(function (url) {
      root.innerHTML = '';
      var name = safeName(activeDoc().title) + '_' + stamp() + '.png';
      deliver(name, 'image/png', url.split(',')[1]);
      toast(t('imageDone'));
    }).catch(function (e) { root.innerHTML = ''; toast('Image : ' + (e && e.message ? e.message : e)); });
  }
  function exportTxt() {
    var d = activeDoc(); syncCurrent();
    var txt = d.type === 'text' ? quill.getText() : d.rows.filter(function (r) { return r.s || r.o; }).map(function (r) { return r.s + '\t' + r.o; }).join('\n');
    deliver(safeName(d.title) + '_' + stamp() + '.txt', 'text/plain', b64(txt));
  }
  function b64(str) {
    var bytes = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function saveFile() {
    var d = activeDoc(); syncCurrent();
    var data = { app: C.appName, format: 1, version: C.version, saved: new Date().toISOString(), doc: d };
    deliver(safeName(d.title) + '_' + stamp() + '.ayneha', 'application/json', b64(JSON.stringify(data)));
    state.dirty = true; saveSession();
  }
  function deliver(name, mime, base64) {
    if (isAndroid) { try { AndroidBridge.saveFile(name, mime, base64); } catch (e) { toast(String(e)); } return; }
    var bin = atob(base64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: mime }));
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
    if (mime === 'application/json') toast(t('saved') + ' : ' + name);
  }
  window.__onFileSaved = function (ok, name) { toast(ok ? t('saved') + ' : ' + name : '×'); };
  $('#file-open').addEventListener('change', function () {
    var f = this.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var data = JSON.parse(rd.result);
        if (!data || ['AYNEHA Editor', 'AYNEHA Web Editor', C.appName].indexOf(data.app) < 0 || !data.doc || !data.doc.type) throw new Error('bad');
        var d = data.doc; d.id = uid();
        addDoc(d); toast(t('opened'));
      } catch (e) { toast(t('badFile')); }
    };
    rd.readAsText(f);
    this.value = '';
  });

  /* ---------------- Mode lecture ---------------- */
  function enterReading() {
    hideImgBox();
    syncCurrent();
    document.body.classList.add('reading');
    quill.disable();
    $$('#dict-view .cell').forEach(function (c) { setEditable(c, false); });
    try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); } catch (e) {}
    setTimeout(fitPage, 50);
  }
  function exitReading() {
    document.body.classList.remove('reading');
    quill.enable();
    if (activeDoc() && activeDoc().type === 'dict') renderDict();
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    setTimeout(fitPage, 50);
  }
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement && document.body.classList.contains('reading') && !isAndroid) exitReading();
  });
  // Bouton retour Android : ferme d'abord ce qui est ouvert
  window.__onBack = function () {
    if ($('#modal').classList.contains('show')) { closeSheet(); return true; }
    if (document.body.classList.contains('reading')) { exitReading(); return true; }
    if (document.body.classList.contains('kbd-open')) { setKeyboard(false); return true; }
    saveSession(); return false;
  };

  /* ---------------- Sauvegarde automatique ---------------- */
  function saveSession() {
    syncCurrent();
    var s = { docs: state.docs, active: state.active, time: Date.now() };
    return DB.set('session', JSON.parse(JSON.stringify(s))).catch(function () {});
  }
  function snapshot(docs) {
    var now = new Date(), name = (C.displayName || C.appName).replace(/\s+/g, '-') + '_' + stamp(now);
    var jobs = docs.map(function (d) { return DB.addSnap({ name: name, time: now.getTime(), doc: JSON.parse(JSON.stringify(d)) }); });
    return Promise.all(jobs).then(pruneSnaps).catch(function () {});
  }
  function pruneSnaps() {
    return DB.allSnaps().then(function (list) {
      list = (list || []).sort(function (a, b) { return b.time - a.time; });
      return Promise.all(list.slice(60).map(function (s) { return DB.delSnap(s.id); }));
    });
  }
  var lastSnapUpdated = {};
  setInterval(function () {
    if (!state.dirty) return;
    syncCurrent();
    var changed = state.docs.filter(function (d) { return lastSnapUpdated[d.id] !== d.updated; });
    changed.forEach(function (d) { lastSnapUpdated[d.id] = d.updated; });
    state.dirty = false;
    saveSession();
    if (changed.length) snapshot(changed);
  }, 60000);
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveSession(); });
  window.addEventListener('pagehide', saveSession);
  window.__saveNow = function () { saveSession(); return true; };

  function toast(msg) {
    var el = $('#toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  /* ---------------- Démarrage ---------------- */
  applyI18n();
  fitPage();
  // Bulles d'aide aussi sur les boutons créés par Quill
  (function labelQuillButtons() {
    var map = { 'ql-bold': 'bold', 'ql-italic': 'italic', 'ql-image': 'image' };
    $$('#toolbar button').forEach(function (b) {
      Object.keys(map).forEach(function (c) { if (b.classList.contains(c)) b.setAttribute('data-i18n-title', map[c]); });
      if (b.classList.contains('ql-list')) b.setAttribute('data-i18n-title', b.value === 'ordered' ? 'listNum' : 'listBullet');
    });
    applyI18n();
  })();
  DB.open().then(function (ok) {
    if (!ok) toast(t('storageOff'));
    return DB.get('session').catch(function () { return null; });
  }).then(function (s) {
    if (s && s.docs && s.docs.length) {
      state.docs = s.docs;
      state.docs.forEach(function (d) { lastSnapUpdated[d.id] = d.updated; });
      var act = state.docs.some(function (d) { return d.id === s.active; }) ? s.active : state.docs[0].id;
      state.active = null; switchTo(act);
    } else {
      var d = makeText(); state.docs.push(d); state.active = null; switchTo(d.id);
    }
    state.dirty = false;
  });

  // Hors ligne (PWA) quand la page est servie par un site
  if (!isAndroid && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
